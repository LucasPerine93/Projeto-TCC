<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel UNO Q</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="painel-bloqueio" style="display: none;">
        <span class="titulo-painel">🔒 SISTEMA DE VIGILÂNCIA<br><span class="subtitulo">[ ACESSO RESTRITO ]</span></span>
        <input type="text" id="caixa-senha" placeholder="Digite sua senha aqui">
        <button id="enviar-senha">Enviar</button>
        <span id="mensagem-erro"></span>
        <span class="rodape-painel">UNO-Q SECURITY PROTOCOL // NODE v1.0</span>
    </div>

    <div id="painel-video" style="display: none;">
        <span class="titulo-painel video-titulo"><span class="ponto-ao-vivo">●</span> TRANSMISSÃO AO VIVO // CÂMERA ESPIÃ - UNO Q</span>
        
        <div class="camera-stream-wrapper cam-superior">
            <iframe id="video" width="720" height="460" src="" frameborder="0"></iframe>
        </div>
    
        <div class="camera-stream-wrapper cam-inferior">
            <iframe id="video2" width="720" height="460" src="" frameborder="0"></iframe>
        </div>

        <button id="botao-bloquear">Bloquear</button>
    </div>

    <div id="servidor-bloqueado" style="display: none;">
        <span class="titulo-painel alerta-titulo">⛔ SERVIDOR BLOQUEADO<br><span class="subtitulo">[ ACESSO REJEITADO ]</span></span>
        <span id="mensagem-bloqueio">Servidor bloqueado, não sera possivel acessar a camera em tempo real</span>
        <span class="rodape-painel alerta-rodape">PROTOCOLO DE LOCKDOWN ATIVADO // CONEXÃO REJEITADA</span>
    </div>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
</body>
</html>
